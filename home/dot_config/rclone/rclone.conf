# mailbox.org Drive per WebDAV. Hier steht bewusst NUR das, was auf jeder
# Maschine gleich ist — Benutzer, Passwort und Unterpfad kommen aus
# ~/.config/rclone/mailbox.env (nicht im Repo, s. README).
#
# NICHT mit `rclone config` anfassen: das Kommando schreibt die Datei komplett
# neu und wirft diese Kommentare weg, und beim nächsten `chezmoi apply` ist die
# Änderung sowieso wieder weg.
#
# Die URL ist der Stolperstein: die Doku von mailbox.org nennt
# .../servlet/webdav.infostore/ als Endpunkt, das ist aber nur die Wurzel des
# Infostores und NICHT der Dateibaum. Der hängt eine Ebene tiefer unter
# Userstore/<Anzeigename>. Deshalb steht hier nur die Wurzel, den Rest setzt
# MAILBOX_PATH — einmal mit `rclone lsd mailbox:` ermittelt.
[mailbox]
type = webdav
url = https://dav.mailbox.org/servlet/webdav.infostore/
vendor = other
