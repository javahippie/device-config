# Arbeitsfenster sind von jeder Deko ausgenommen — egal was effects.conf später treibt.
# Die Lehre aus dem Citrix-Milchglas auf dem Book.
# Klassen bei Bedarf mit `hyprctl clients` verifizieren.

windowrulev2 = opacity 1.0 override 1.0 override, class:^(Wfica|wfica)
windowrulev2 = noblur, class:^(Wfica|wfica)
windowrulev2 = nodim, class:^(Wfica|wfica)
