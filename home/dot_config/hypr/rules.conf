# Arbeitsfenster sind von jeder Deko ausgenommen, egal was effects.conf treibt.
# Grammatik seit 0.53: EIN match, alle Effekte mit Werten. windowrulev2 existiert nicht mehr.
# Klassen verifizieren: hyprctl clients

windowrule = opacity 1.0 override 1.0 override, no_blur on, no_dim on, match:class ^(Wfica|wfica)$

# Waybars persistent-workspaces (config.jsonc) zeigt 1-6 nur zuverlässig an,
# wenn Hyprland selbst die Workspaces als persistent kennt.
workspace = 1, persistent:true
workspace = 2, persistent:true
workspace = 3, persistent:true
workspace = 4, persistent:true
workspace = 5, persistent:true
workspace = 6, persistent:true
