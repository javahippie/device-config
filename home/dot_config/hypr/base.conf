# --- Input ---
input {
    kb_layout = de
    numlock_by_default = true
    follow_mouse = 1
}

# --- Autostart ---
# Env-Durchreichen an systemd/D-Bus zuerst — sonst finden Portale/Flatpaks die Session nicht.
# (start-hyprland erledigt einen Teil davon, doppelt schadet nicht.)
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = /usr/libexec/polkit-mate-authentication-agent-1
exec-once = waybar
exec-once = mako
exec-once = wl-paste --watch cliphist store

# --- Sonstiges ---
misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
}

# --- Environment ---
# Electron-Apps (Element, Slack, Signal, Cider) nativ auf Wayland statt XWayland
env = ELECTRON_OZONE_PLATFORM_HINT,auto
