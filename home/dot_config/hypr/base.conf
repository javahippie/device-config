# --- Input ---
input {
    kb_layout = de
    numlock_by_default = true
    follow_mouse = 1
}

# --- Autostart ---
# Env-Durchreichen an systemd/D-Bus zuerst — sonst finden Portale/Flatpaks die Session nicht.
# (start-hyprland erledigt einen Teil davon, doppelt schadet nicht.)
#
# XDG_DATA_DIRS MUSS mit durch: Portal-Backends erben ihre Umgebung von der
# D-Bus-/systemd-Activation-Environment, nicht von der Login-Shell. Fehlt es,
# findet das Portal die .desktop-Dateien von --user-Flatpaks nicht (die liegen
# in ~/.local/share/flatpak/exports/share/applications/) und kann den als
# Default gesetzten Browser nicht starten — Login-Flows in Element/Cider tun
# dann einfach nichts, obwohl `xdg-mime query default` korrekt antwortet.
# Bei DM-losen Sessions ist dieses Durchreichen laut xdg-desktop-portal-Doku
# ausdrücklich Aufgabe des Users.
# QT_QPA_PLATFORMTHEME muss mit durch (s. Environment unten): Double Commander
# wird nicht nur ueber SUPER+E gestartet, sondern auch als Handler fuer
# inode/directory (mimeapps.list). In dem Fall startet ihn das Portal aus der
# systemd-Activation-Environment heraus, nicht als Kind von Hyprland — ohne
# diesen Eintrag kaeme er dann hell hoch und ueber die Taste dunkel.
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_TYPE XDG_DATA_DIRS PATH QT_QPA_PLATFORMTHEME
# start-hyprland ersetzt uwsm, aktiviert dabei aber NICHT graphical-session.target.
# xdg-desktop-portal.service hat eine harte Dependency darauf und bleibt ohne
# das hier für immer im Zustand "Dependency failed" — kein Portal-Call geht
# durch, egal wie das übrige Setup aussieht. Unit: systemd/user/hyprland-session.target.
exec-once = systemctl --user start hyprland-session.target
# XSettings-Manager für XWayland-Clients. Hyprland bringt keinen mit, und ohne
# ihn bekommen X11-Toolkits keinerlei Schrift-Einstellungen: Java/Swing liefert
# dann awt.font.desktophints == null und rendert komplett ohne Antialiasing.
# Werte in dot_config/xsettingsd/xsettingsd.conf.
exec-once = xsettingsd
exec-once = /usr/libexec/polkit-mate-authentication-agent-1
exec-once = hypridle
exec-once = waybar
exec-once = mako
exec-once = wl-paste --watch cliphist store
# Setzt das zuletzt gewählte Wallpaper wieder (swaybg). Ohne Bilder in
# ~/Pictures/wallpapers macht der Aufruf absichtlich gar nichts und endet mit 0 —
# dann bleibt background_color unten stehen. Switcher: dot_local/bin/wallpaper.
exec-once = ~/.local/bin/wallpaper restore

# --- Sonstiges ---
misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    # Flache Mocha-Base-Farbe als Grundton. Seit es swaybg gibt (s. exec-once
    # oben) ist das der FALLBACK: liegt kein Bild in ~/Pictures/wallpapers,
    # startet swaybg nicht und diese Farbe bleibt sichtbar.
    # force_default_wallpaper unterdrückt Hyprlands eigenes Default-Wallpaper,
    # sonst gewinnt das gegen background_color.
    force_default_wallpaper = 0
    background_color = $base
}

# --- Environment ---
# Electron-Apps (Element, Slack, Signal, Cider) nativ auf Wayland statt XWayland
env = ELECTRON_OZONE_PLATFORM_HINT,auto

# Qt6 holt sich Palette und Dialoge aus GTK3. Zweck ist der Dark Mode von
# Double Commander: das Programm ist Lazarus/LCL auf Qt6 und hat unter Linux
# KEINEN eigenen Dark Mode — die Optionsseite dafuer (pgDarkMode) steckt zwar
# im Binary, wird aber nur unter Windows eingehaengt. Im Kategorie-Dropdown
# unter "Farben" stehen hier nur Anzeige fuer freien Speicher, Schnellansicht,
# Vergleichsansicht, Log und Verzeichnisse synchronisieren.
#
# Ohne Platform-Theme nimmt Qt seine eingebaute helle Default-Palette, und die
# Panel-Farben von DC stehen ab Werk auf SYMBOLISCHEN Werten ("Fenster",
# "Voreingestellt" = clWindow/clDefault) — sie folgen also der Palette. Genau
# deshalb reicht diese eine Zeile plus dot_config/gtk-3.0/settings.ini fuer ein
# komplett dunkles Fenster, inklusive Menueleiste, Toolbar und Dialogen.
#
# Das Plugin (/usr/lib64/qt6/plugins/platformthemes/libqgtk3.so) liegt schon da,
# es gehoert zu qt6-qtbase-gui — KEIN zusaetzliches Paket noetig, insbesondere
# kein qt6ct und kein adwaita-qt6.
#
# Global und nicht nur fuer DC, weil es fuer jedes native Qt-Programm hier das
# Richtige tut (KeePassXC). Flatpaks sind nicht betroffen: die erben die
# Host-Umgebung nicht, die bringen ihr Theming selbst mit.
env = QT_QPA_PLATFORMTHEME,gtk3
