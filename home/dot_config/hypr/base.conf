# --- Input ---
input {
    kb_layout = de
    numlock_by_default = true
    follow_mouse = 1
}

# --- Autostart ---
# Env-Durchreichen an systemd/D-Bus zuerst — sonst finden Portale/Flatpaks die Session nicht.
# (start-hyprland erledigt einen Teil davon, doppelt schadet nicht.)
#
# XDG_DATA_DIRS MUSS mit durch: Portal-Backends erben ihre Umgebung von der
# D-Bus-/systemd-Activation-Environment, nicht von der Login-Shell. Fehlt es,
# findet das Portal die .desktop-Dateien von --user-Flatpaks nicht (die liegen
# in ~/.local/share/flatpak/exports/share/applications/) und kann den als
# Default gesetzten Browser nicht starten — Login-Flows in Element/Cider tun
# dann einfach nichts, obwohl `xdg-mime query default` korrekt antwortet.
# Bei DM-losen Sessions ist dieses Durchreichen laut xdg-desktop-portal-Doku
# ausdrücklich Aufgabe des Users.
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_TYPE XDG_DATA_DIRS PATH
# start-hyprland ersetzt uwsm, aktiviert dabei aber NICHT graphical-session.target.
# xdg-desktop-portal.service hat eine harte Dependency darauf und bleibt ohne
# das hier für immer im Zustand "Dependency failed" — kein Portal-Call geht
# durch, egal wie das übrige Setup aussieht. Unit: systemd/user/hyprland-session.target.
exec-once = systemctl --user start hyprland-session.target
exec-once = /usr/libexec/polkit-mate-authentication-agent-1
exec-once = hypridle
exec-once = waybar
exec-once = mako
exec-once = wl-paste --watch cliphist store

# --- Sonstiges ---
misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    # Wallpaper = flache Mocha-Base-Farbe statt Bilddatei — kein Wallpaper-Daemon,
    # keine Binary im Repo. force_default_wallpaper unterdrückt Hyprlands eigenes
    # Default-Wallpaper, sonst gewinnt das gegen background_color.
    force_default_wallpaper = 0
    background_color = $base
}

# --- Environment ---
# Electron-Apps (Element, Slack, Signal, Cider) nativ auf Wayland statt XWayland
env = ELECTRON_OZONE_PLATFORM_HINT,auto
