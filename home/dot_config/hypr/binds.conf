$mod = SUPER

# --- Hilfe ---
# Zeigt GENAU DIESE DATEI als fuzzel-Popup — dot_local/bin/keybinds parst sie,
# inklusive der "# --- Abschnitt ---"-Zeilen. Neue Bindings tauchen also von
# selbst auf, es gibt keine zweite Liste zum Nachpflegen.
# F1 statt des üblichen SUPER+/: der Slash liegt auf de-Layout hinter SHIFT+7.
bind = $mod, F1, exec, ~/.local/bin/keybinds

# --- Kern ---
bind = $mod, Return, exec, foot
bind = $mod, D, exec, fuzzel
bind = $mod, Q, killactive
bind = $mod, F, fullscreen, 0
bind = $mod, V, togglefloating
bind = $mod SHIFT, E, exit
bind = $mod, L, exec, hyprlock

# --- Fokus (vim-Style) ---
bind = $mod, H, movefocus, l
bind = $mod, J, movefocus, d
bind = $mod, K, movefocus, u
bind = $mod, semicolon, movefocus, r

# --- Workspaces 1-9 ---
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9

# --- Screenshots --- (s. dot_local/bin/screenshot; speichert UND kopiert)
# ACHTUNG geänderte Semantik: SHIFT+Print war "alle Monitore in ein Bild",
# ist jetzt "aktueller Monitor". Das alte Verhalten liegt auf $mod SHIFT+Print.
bind = , Print, exec, ~/.local/bin/screenshot region
bind = SHIFT, Print, exec, ~/.local/bin/screenshot screen
bind = $mod, Print, exec, ~/.local/bin/screenshot window
bind = $mod SHIFT, Print, exec, ~/.local/bin/screenshot all

# --- Clipboard-History ---
bind = $mod, C, exec, cliphist list | fuzzel --dmenu | cliphist decode | wl-copy

# Voller Pfad, kein blosser Name: unter SDDM läuft die Session ohne Login-Shell,
# damit fehlt ~/.local/bin im PATH und die Bindings scheitern still. Hyprland
# führt `exec` über /bin/sh -c aus, die Tilde wird also expandiert.

# --- Elgato Key Light --- ($mod, K ist movefocus, also SHIFT hier)
bind = $mod SHIFT, K, exec, ~/.local/bin/keylight toggle

# --- Audio --- (identisch zum Rechtsklick auf das Vol-Modul der Waybar)
bind = $mod, A, exec, ~/.local/bin/audio-out pick

# --- Bluetooth --- (identisch zu Links-/Rechtsklick auf das BT-Modul der Waybar)
bind = $mod, B, exec, ~/.local/bin/bt pick
bind = $mod SHIFT, B, exec, ~/.local/bin/bt pair

# --- Wallpaper --- (Bilder in ~/Pictures/wallpapers, s. dot_local/bin/wallpaper)
bind = $mod SHIFT, W, exec, ~/.local/bin/wallpaper pick
bind = $mod ALT, W, exec, ~/.local/bin/wallpaper next
