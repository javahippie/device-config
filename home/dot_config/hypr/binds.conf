$mod = SUPER

# --- Hilfe ---
# Zeigt GENAU DIESE DATEI als fuzzel-Popup — dot_local/bin/keybinds parst sie,
# inklusive der "# --- Abschnitt ---"-Zeilen. Neue Bindings tauchen also von
# selbst auf, es gibt keine zweite Liste zum Nachpflegen.
# F1 statt des üblichen SUPER+/: der Slash liegt auf de-Layout hinter SHIFT+7.
bind = $mod, F1, exec, ~/.local/bin/keybinds

# --- Kern ---
bind = $mod, Return, exec, foot
bind = $mod, D, exec, fuzzel
bind = $mod, Q, killactive
bind = $mod, F, fullscreen, 0
bind = $mod, V, togglefloating
bind = $mod, L, exec, hyprlock

# --- Fokus (vim-Style) ---
bind = $mod, H, movefocus, l
bind = $mod, J, movefocus, d
bind = $mod, K, movefocus, u
bind = $mod, semicolon, movefocus, r

# --- Workspaces 1-9 ---
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9

# --- Screenshots --- (s. dot_local/bin/screenshot; speichert UND kopiert)
# ACHTUNG geänderte Semantik: SHIFT+Print war "alle Monitore in ein Bild",
# ist jetzt "aktueller Monitor". Das alte Verhalten liegt auf $mod SHIFT+Print.
bind = , Print, exec, ~/.local/bin/screenshot region
bind = SHIFT, Print, exec, ~/.local/bin/screenshot screen
bind = $mod, Print, exec, ~/.local/bin/screenshot window
bind = $mod SHIFT, Print, exec, ~/.local/bin/screenshot all
# Zweitbelegung ohne Print-Taste: die MX Keys auf "cube" hat keine. Ihre
# Kamera-Taste über dem Nummernblock schickt Win+Shift+S (der Snipping-Griff aus
# Windows) — mit wev nachgemessen, kein Mapping nötig, sie trifft direkt die
# erste Zeile hier. Auf "book" (eingebaute Tastatur mit Print) gelten weiter die
# Zeilen oben; beide Sätze existieren absichtlich nebeneinander.
#
# Weil die Taste selbst eine Kombination ist, kann man Modifier draufstapeln:
# Ctrl bzw. Alt zusätzlich halten und die Kamera-Taste drücken. Das bildet
# Print / SHIFT+Print / SUPER+Print eins zu eins nach.
bind = $mod SHIFT, S, exec, ~/.local/bin/screenshot region
bind = $mod SHIFT CTRL, S, exec, ~/.local/bin/screenshot window
bind = $mod SHIFT ALT, S, exec, ~/.local/bin/screenshot screen
# 'all' bekommt hier bewusst keine Taste: cube hat einen Monitor, dort ist es
# identisch mit 'screen'. Auf book geht es über SUPER+SHIFT+Print, sonst per CLI.

# --- Bildschirmaufnahme --- (s. dot_local/bin/record; wf-recorder)
# Dieselben drei Modi mit denselben Modifiern wie die Screenshot-Zweitbelegung
# darüber, nur auf R statt S — R war auf beiden Hosts komplett frei
# (`hyprctl binds` gegengeprüft, 08.09.2026).
#
# KEIN Anhängsel an die Kamera-Taste der MX Keys: die schickt eine feste
# Kombination (Win+Shift+S), und ihre drei stapelbaren Varianten sind von den
# Screenshots schon belegt. Für eine Aufnahme bliebe nur ein Vierfingergriff.
#
# Alle drei rufen `toggle`, nicht `region`/`window`/`screen` direkt: läuft schon
# eine Aufnahme, beendet JEDE der drei Tasten sie. Man soll sich nicht merken
# müssen, mit welcher man angefangen hat.
#
# Ton ist aus, solange RECORD_AUDIO nicht gesetzt ist — ein Toggle, der
# unbemerkt das Mikrofon mitschneidet, wäre die falsche Vorgabe. Einschalten
# per `RECORD_AUDIO=1` in der Umgebung (s. README "Bildschirmaufnahme").
bind = $mod SHIFT, R, exec, ~/.local/bin/record toggle region
bind = $mod SHIFT CTRL, R, exec, ~/.local/bin/record toggle window
bind = $mod SHIFT ALT, R, exec, ~/.local/bin/record toggle screen

# --- Clipboard-History ---
bind = $mod, C, exec, cliphist list | fuzzel --dmenu | cliphist decode | wl-copy

# Voller Pfad, kein blosser Name: unter SDDM läuft die Session ohne Login-Shell,
# damit fehlt ~/.local/bin im PATH und die Bindings scheitern still. Hyprland
# führt `exec` über /bin/sh -c aus, die Tilde wird also expandiert.

# --- ToDo --- (s. dot_local/bin/todo; Datei <XDG-Dokumente>/todo.md)
# SUPER+T oeffnet das fuzzel-Overlay, Enter schreibt eine Markdown-Zeile und das
# Popup ist wieder weg. SHIFT dazu zeigt die offenen Punkte, Enter hakt ab —
# dasselbe Muster wie 'wallpaper pick' / 'bt pick'.
bind = $mod, T, exec, ~/.local/bin/todo
bind = $mod SHIFT, T, exec, ~/.local/bin/todo list

# --- Dateimanager ---
# SUPER+E wie unter Windows. SUPER+SHIFT+E war frueher "exit" (Session
# abmelden) und ist bewusst entfernt: an diesem Rechner wird entweder gesperrt
# ($mod+L) oder heruntergefahren — ein Abmelden per Tastendruck direkt neben dem
# Dateimanager ist nur eine Gelegenheit, versehentlich alles zuzumachen.
# Binary heisst doublecmd-qt6, NICHT doublecmd: den Namen ohne Suffix belegt das
# GTK2-Paket, das nur unter XWayland laeuft (s. packages.txt). Ein Tippfehler hier
# faellt nicht durch einen Fehler auf, sondern durch Drag & Drop, das nicht geht.
bind = $mod, E, exec, doublecmd-qt6

# --- Rechner --- (gnome-calculator, s. packages.txt)
# Die Rechner-Taste der MX Keys ueber dem Nummernblock schickt einen echten
# Keycode: mit wev nachgemessen ergibt Taste 148 das Keysym XF86Calculator,
# es braucht also kein Mapping. Gleiche Lage wie bei den Fn-Tasten des book,
# anders als bei der Kamera-Taste, die eine Kombination schickt.
# Kein $mod-Zweitsatz wie bei den Screenshots: solange niemand die Taste
# vermisst, bleibt es bei der einen Zeile — nachruesten ist eine Zeile.
bind = , XF86Calculator, exec, gnome-calculator

# --- Elgato Key Light --- ($mod, K ist movefocus, also SHIFT hier)
bind = $mod SHIFT, K, exec, ~/.local/bin/keylight toggle

# --- Audio --- (identisch zum Rechtsklick auf das Vol-Modul der Waybar)
bind = $mod, A, exec, ~/.local/bin/audio-out pick

# --- Bluetooth --- (identisch zu Links-/Rechtsklick auf das BT-Modul der Waybar)
bind = $mod, B, exec, ~/.local/bin/bt pick
bind = $mod SHIFT, B, exec, ~/.local/bin/bt pair

# --- Wallpaper --- (Bilder in ~/Pictures/wallpapers, s. dot_local/bin/wallpaper)
bind = $mod SHIFT, W, exec, ~/.local/bin/wallpaper pick
bind = $mod ALT, W, exec, ~/.local/bin/wallpaper next

# --- Tastaturbeleuchtung --- (nur "book"; auf dem cube sagt das Skript, dass
# kein Controller da ist, statt kommentarlos nichts zu tun)
#
# Die drei Fn-Tasten melden sich als echte Keycodes: das Input-Device
# "Uniwill WMI hotkeys" kann laut Capability-Bitmap KBDILLUMTOGGLE, KBDILLUMUP
# und KBDILLUMDOWN. Es braucht also keinen Umweg über ein Custom-Modul.
#
# bindl statt bind: soll auch bei gesperrtem Bildschirm gehen — Licht anmachen
# ist nichts, wofür man erst das Passwort tippen will. Zusätzlich 'e' bei
# Auf/Ab, damit Gedrückthalten wiederholt.
bindl  = , XF86KbdLightOnOff,     exec, ~/.local/bin/kbdlight toggle
bindel = , XF86KbdBrightnessUp,   exec, ~/.local/bin/kbdlight up
bindel = , XF86KbdBrightnessDown, exec, ~/.local/bin/kbdlight down

# Farbwähler, analog zu 'wallpaper pick'. $mod SHIFT K ist das Key Light,
# deshalb hier ALT — dasselbe Muster wie beim Wallpaper ($mod SHIFT W / $mod ALT W).
bind = $mod ALT, K, exec, ~/.local/bin/kbdlight pick

# --- Medien --- (playerctl, steuert mpv UND Cider; s. README "Musik")
#
# playerctl spricht MPRIS, nicht ein bestimmtes Programm. Cider bringt das von
# Haus aus mit, mpv erst durch mpv-mpris (packages.txt) — dessen Skript liegt
# systemweit unter /etc/mpv/scripts, es ist an mpv selbst nichts einzustellen.
#
# `-p mpv,%any` ist die ganze Kollisionsaufloesung: ohne -p nimmt playerctl laut
# man-Page "den ersten verfuegbaren Player", und welcher das bei laufendem Cider
# UND laufendem mpv ist, ist nichts, worauf man sich verlassen will. Die Liste
# heisst: lokaler Player zuerst, sonst irgendeiner (also Cider). Wer gerade
# etwas lokal abspielt, meint mit der Taste das. Namen notfalls mit
# `playerctl -l` nachsehen.
#
# Das Komma in `mpv,%any` ueberlebt Hyprlands Parser — nachgemessen mit
# `hyprctl keyword bind` und `hyprctl binds`: gesplittet wird nur bis zum
# Dispatcher, danach bleibt der Rest der Zeile ein Argument
# ("arg: playerctl -p mpv,%any play-pause"). Es braucht also keine
# Anfuehrungszeichen und kein Wrapper-Skript.
#
# bindl wie bei der Tastaturbeleuchtung: soll auch bei gesperrtem Bildschirm
# gehen — Musik anhalten ist nichts, wofuer man erst das Passwort tippt. Wer das
# anders sieht, macht bind draus.
#
# NICHT auf dieser Hardware nachgemessen (anders als Kamera- und Rechner-Taste
# der MX Keys): ob die Tasten wirklich XF86AudioPlay & Co. schicken, zeigt `wev`.
# Tut sich nichts, ist es die Taste und nicht playerctl — das prueft man mit
# `playerctl -p mpv,%any play-pause` direkt im Terminal.
bindl = , XF86AudioPlay,        exec, playerctl -p mpv,%any play-pause
bindl = , XF86AudioPause,       exec, playerctl -p mpv,%any play-pause
bindl = , XF86AudioNext,        exec, playerctl -p mpv,%any next
bindl = , XF86AudioPrev,        exec, playerctl -p mpv,%any previous
bindl = , XF86AudioStop,        exec, playerctl -p mpv,%any stop
