# Catppuccin Mocha, angelehnt an github.com/catppuccin/hyprlock (MIT), aber ohne
# externe Bild-Assets: kein ~/.face-Avatar, kein Wallpaper-Pfad — Hintergrund ist
# die flache Mocha-Base-Farbe, analog zum Compositor-Hintergrund in base.conf.

source = ~/.config/hypr/mocha.conf

$accent = $mauve
$accentAlpha = $mauveAlpha
$font = JetBrains Mono

general {
    hide_cursor = true
}

background {
    monitor =
    color = $base
    blur_passes = 0
}

label {
    monitor =
    text = $TIME
    color = $text
    font_size = 90
    font_family = $font
    position = -30, 0
    halign = right
    valign = top
}

label {
    monitor =
    text = cmd[update:43200000] date +"%A, %d %B %Y"
    color = $subtext1
    font_size = 22
    font_family = $font
    position = -30, -110
    halign = right
    valign = top
}

label {
    monitor =
    text = Layout: $LAYOUT
    color = $subtext1
    font_size = 18
    font_family = $font
    position = 30, -30
    halign = left
    valign = top
}

input-field {
    monitor =
    size = 300, 60
    outline_thickness = 3
    dots_size = 0.2
    dots_spacing = 0.3
    dots_center = true
    outer_color = $accent
    inner_color = $surface0
    font_color = $text
    fade_on_empty = false
    placeholder_text = <span foreground="##$textAlpha">Logged in as <span foreground="##$accentAlpha">$USER</span></span>
    hide_input = false
    check_color = $accent
    fail_color = $red
    fail_text = <i>$FAIL ($ATTEMPTS)</i>
    capslock_color = $yellow
    position = 0, -47
    halign = center
    valign = center
}
