# ============================================================
# DEKO-NULLPUNKT. Hyprlands Werksdefaults haben Blur, Schatten
# und Animationen AN — hier wird alles explizit ausgeschaltet.
# Jeder Effekt, der je dazukommt, ist eine bewusste Zeile HIER.
# Live testen:  hyprctl keyword decoration:blur:enabled true
# ============================================================

general {
    gaps_in = 4
    gaps_out = 8
    # 3 statt 2: der aktive Border ist die einzige Fokusanzeige (kein
    # dim_inactive, keine Schatten), und bei 2 px geht der Mauve-Rahmen auf
    # 3440x1440 zwischen den Fenstern unter.
    border_size = 3
    # Farbe ist keine Deko im Sinne der Nullpunkt-Regel (der Border ist so oder
    # so da) — Catppuccin Mocha, Mauve-Akzent. Palette kommt aus mocha.conf.
    col.active_border = $mauve
    col.inactive_border = $surface1
}

decoration {
    # Bewusste Ausnahme vom Nullpunkt, zweite nach den Animationen: minimale
    # Rundung, gerade genug, damit Fensterecken nicht wie ausgeschnitten
    # wirken. 4 px bleibt unter der Border-Breite mal zwei, dadurch bleibt der
    # Rahmen in der Ecke geschlossen statt auszufransen.
    rounding = 4
    blur {
        enabled = false
    }
    shadow {
        enabled = false
    }
    dim_inactive = false
}

animations {
    # Bewusste Ausnahme vom Nullpunkt: nur schnelle Slides, kein Fade-Zirkus.
    enabled = true
    bezier = quick, 0.25, 1, 0.5, 1
    animation = windows, 1, 2, quick, slide
    animation = workspaces, 1, 2, quick, slide
    animation = fade, 0
    animation = border, 0
}
