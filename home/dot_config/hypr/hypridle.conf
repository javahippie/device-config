# Idle-Kette: erst sperren, dann Display aus, zuletzt Suspend.
# Autostart über exec-once in base.conf. Manuelles Sperren bleibt $mod+L (hyprlock).

general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on
}

listener {
    timeout = 300                    # 5 min: sperren
    on-timeout = loginctl lock-session
}

listener {
    timeout = 330                    # 5:30 min: Display aus
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

listener {
    timeout = 900                    # 15 min: Suspend
    on-timeout = systemctl suspend
}
