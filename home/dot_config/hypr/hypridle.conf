# Idle-Kette, zweistufig: erst sperren (5 min), dann Suspend (15 min).
# Die frueher dazwischen liegende Display-Aus-Stufe ist raus, Begruendung unten.
# Autostart über exec-once in base.conf. Manuelles Sperren bleibt $mod+L (hyprlock).

general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on
}

listener {
    timeout = 300                    # 5 min: sperren
    on-timeout = loginctl lock-session
}

# BEWUSST KEIN dpms-off-Listener (frueher: 330 s). Das Ausschalten des Displays
# kostete jedes Mal einen laufenden Thunderbird — Kontextmenues gingen danach
# nicht mehr auf, nur ein Neustart half. Kette, im Hyprland-Log dreimal
# identisch belegt:
#   drm: Disabling output HDMI-A-2
#   drm: Got a hotplug event for /dev/dri/card1
#   drm: Connector HDMI-A-2 disconnected        <- Monitor ist WEG, nicht nur dunkel
#   Swapchain: Reconfigured a swapchain to [1920, 1080]   <- Fallback statt 3440x1440
# Der Monitor laesst im Standby die HPD-Leitung fallen, also meldet der Kernel
# den Connector als abgezogen. Hyprland zerstoert daraufhin den wl_output und
# legt ihn beim Aufwachen neu an. Gecko cached die GTK-Workarea ueber dieses
# Ereignis hinweg falsch und erzeugt Popups danach mit kaputter Geometrie.
# Mozilla-Bug 1564076 -> 2036975 -> 2026258, Fix ("Fall back to wl_output
# monitor size if we're missing Gtk workarea") ist in Gecko 151/152 gelandet.
# Firefox (nativ, 153) hat ihn und ist unauffaellig; Thunderbird 140 ESR ist
# Gecko 140 und hat ihn nicht — deshalb traf es genau eine App.
#
# Preis: der Bildschirm bleibt zwischen Lock (5 min) und Suspend (15 min) an,
# er zeigt dabei den fast schwarzen hyprlock-Screen. Bewusst nicht auf "kurz
# vor dem Suspend geschoben": der Disconnect folgt dem dpms-off binnen
# Sekunden, die Dauer ist also egal — es zaehlt nur, ob es ueberhaupt passiert.
# Wenn das Display-Aus zurueck soll, ist der Weg NICHT dieser Listener, sondern
# den Connector kernelseitig als dauerhaft verbunden zu erzwingen
# (Kernel-Cmdline video=HDMI-A-2:e) — dann bleibt der wl_output stehen.

# Damit dieser Suspend auch wirklich durchlaeuft, muss auf "cube" der
# Logitech-Unifying-Empfaenger an einem CPU-seitigen USB-Controller stecken
# (11:00.3, 11:00.4 oder 12:00.0). Am Chipsatz-Controller 0f:00.0 zieht er
# dauerhaft PME#, und der Kernel bricht mit "Wakeup pending. Abort CPU freeze"
# ab — reproduzierbar, nicht sporadisch. Hergeleitet und belegt im README,
# Abschnitt "Suspend haengt sich auf".
listener {
    timeout = 900                    # 15 min: Suspend
    on-timeout = systemctl suspend
}
