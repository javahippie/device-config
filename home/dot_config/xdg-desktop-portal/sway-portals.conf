# Wer bedient welches Portal-Interface in der Sway-Session.
# Der Dateiname MUSS zum Wert von
# XDG_CURRENT_DESKTOP passen (Sway setzt "sway"), sonst sucht
# xdg-desktop-portal die Datei gar nicht erst.
#
# wlr-Portal fuer Screencast/Screenshot: das frueher hier danebenliegende
# hyprland-Backend sprach Hyprlands eigenes Protokoll und konnte mit Sway nichts
# anfangen. xdg-desktop-portal-wlr ist das wlroots-Gegenstueck und steht in
# packages.txt — installiert ist nur noch dieses,
# aktiv ist immer nur das zur laufenden Session passende.
# GTK-Portal wie drueben fuer Datei-Dialoge und Settings.
# Fehlt diese Datei, haben Flatpak-Apps u. U. keinen "Oeffnen"-Dialog.

[preferred]
default = wlr;gtk
org.freedesktop.impl.portal.FileChooser = gtk
