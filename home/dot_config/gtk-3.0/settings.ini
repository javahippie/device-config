# GTK3-Einstellungen — hier vor allem als FARBQUELLE FUER QT6.
#
# Klingt verdreht, ist aber der Punkt: Double Commander (doublecmd-qt6) ist ein
# Lazarus/LCL-Programm auf Qt6 und hat unter Linux KEINEN eigenen Dark Mode.
# Die Optionsseite dafuer existiert zwar im Binary (`strings` zeigt pgDarkMode
# neben pgViewer/pgLog/pgDiffer), sie wird aber zur Laufzeit nur auf Windows
# eingehaengt — im Kategorie-Dropdown unter "Farben" stehen hier nur fuenf
# Eintraege, Dark Mode ist keiner davon. Das ist kein Fedora-Bug, das Formular
# wird schlicht fuer alle Plattformen mitkompiliert.
#
# Qt zieht seine Palette stattdessen aus einem Platform-Theme, und
# /usr/lib64/qt6/plugins/platformthemes/libqgtk3.so liegt bereits da (Teil von
# qt6-qtbase-gui, kein zusaetzliches Paket). Das Plugin baut die Qt-Palette aus
# GTK3 — also faerbt diese Datei das Qt-Fensterwerk: Menueleiste, Toolbar,
# Tab-Reiter, Dialoge, Optionsfenster. Aktiviert wird es ueber
# QT_QPA_PLATFORMTHEME=gtk3 in hypr/base.conf.
#
# Bewusst NICHT GTK_THEME=Adwaita:dark als Env-Variable: das ist laut GTK-Doku
# ein Debug-Override, der jede andere Theme-Wahl uebersteuert und auch fuer
# echte GTK-Programme gilt. prefer-dark ist der vorgesehene Weg und deckt
# beides ab.
[Settings]

# Adwaita hat keine eigene "-dark"-Variante als Theme-Verzeichnis (unter
# /usr/share/themes liegen nur Default/Emacs/Raleigh) — GTK3 schaltet die
# dunkle Variante ueber genau dieses Flag um. Ueber qgtk3 landet sie damit
# auch in Qt.
gtk-theme-name = Adwaita
gtk-application-prefer-dark-theme = 1

# Passend zu dconf: org.gnome.desktop.interface color-scheme steht auf
# 'prefer-dark'. Das lesen GTK4/libadwaita-Programme und das Portal; GTK3
# ignoriert es und braucht das Flag oben. Beide Seiten sagen jetzt dasselbe.

# Schrift-Einstellungen bleiben ABSICHTLICH draussen. Fuer XWayland laeuft das
# ueber xsettingsd (s. dot_config/xsettingsd/), fuer native Wayland-GTK-Apps
# ueber gsettings — eine dritte Quelle hier waere genau die Art Doppelung, die
# hinterher niemand mehr auseinanderhaelt.
