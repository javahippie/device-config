# RNNoise-Rauschunterdrückung für Mikrofone — immer an, ohne GUI und ohne Daemon.
#
# Das hier ist KEINE vollständige pipewire.conf, sondern ein Drop-in: PipeWire
# liest ~/.config/pipewire/pipewire.conf.d/*.conf zusätzlich zur System-Config
# und merged die Abschnitte. Deshalb steht hier nur context.modules — der Rest
# bleibt Fedora-Default. Eine kopierte pipewire.conf wäre die schlechtere Wahl:
# die friert Upstream-Defaults ein, dieses Drop-in nicht.
#
# Es entsteht eine virtuelle Quelle "Mikrofon (RNNoise)". Die Aufnahmeseite
# hängt sich an das physische Mikrofon, die Wiedergabeseite ist das, was Slack,
# Element, Firefox & Co. als Eingang sehen. Filtern muss deshalb keine App
# selbst — es gibt schlicht kein ungefiltertes Standardmikrofon mehr.
#
# Das LADSPA-Plugin liegt NICHT in einem Fedora-Paket (geprüft: 'rnnoise' im
# Repo ist nur die Bibliothek, ohne Plugin-Wrapper; ein
# noise-suppression-for-voice gibt es in Fedora nicht). bootstrap.sh installiert
# deshalb das Release-Binary nach /usr/local/lib/ladspa — gleiches Muster wie
# minikube und lazydocker.
context.modules = [
    {   name = libpipewire-module-filter-chain
        # nofail ist NICHT optional. Ohne das Flag beendet sich PipeWire
        # komplett, wenn ein Modul aus context.modules nicht lädt — und genau
        # das passiert, solange /usr/local/lib/ladspa/librnnoise_ladspa.so
        # fehlt: chezmoi apply legt diese Datei an, bootstrap.sh installiert das
        # Plugin. Wer die Reihenfolge dreht (oder das Repo auf eine Maschine
        # zieht, auf der bootstrap noch nicht lief), hätte sonst gar keinen Ton
        # mehr — nicht bloß keine Rauschunterdrückung. Mit nofail fehlt in dem
        # Fall nur die virtuelle Quelle.
        flags = [ nofail ]
        args = {
            node.description = "Mikrofon (RNNoise)"
            media.name       = "Mikrofon (RNNoise)"

            filter.graph = {
                nodes = [
                    {   type   = ladspa
                        # Absoluter Pfad mit Absicht: PipeWire durchsucht bei
                        # einem bloßen Namen nur LADSPA_PATH bzw. /usr/lib64/ladspa
                        # und /usr/lib/ladspa — /usr/local/lib/ladspa ist da NICHT
                        # zwingend dabei. Mit vollem Pfad entfällt die Frage.
                        plugin = /usr/local/lib/ladspa/librnnoise_ladspa.so
                        label  = noise_suppressor_mono
                        name   = rnnoise
                        control = {
                            # Ab wieviel "das ist Sprache"-Konfidenz durchgelassen
                            # wird. Höher = aggressiver, schneidet aber auch leise
                            # Satzanfänge ab. 50 ist der brauchbare Mittelweg;
                            # bei lauter Umgebung schrittweise Richtung 90 gehen.
                            "VAD Threshold (%)"          = 50.0
                            # Nach dem letzten erkannten Sprachframe noch so lange
                            # offen halten — ohne das klingen Wortenden abgehackt.
                            "VAD Grace Period (ms)"      = 200
                            "Retroactive VAD Grace (ms)" = 0
                        }
                    }
                ]
            }

            capture.props = {
                node.name    = "capture.rnnoise_source"
                # passive: der Link zum echten Mikrofon hält den Graphen nicht
                # von allein am Laufen. Ohne das läge das Mikrofon dauerhaft
                # offen (Aufnahme-LED an, Anzeige "wird benutzt" in jeder App).
                node.passive = true
                # RNNoise arbeitet intern auf 48 kHz. Feste Rate hier spart den
                # Resampler und damit Latenz.
                audio.rate     = 48000
                audio.channels = 1
                audio.position = [ MONO ]
            }

            playback.props = {
                node.name      = "rnnoise_source"
                media.class    = Audio/Source
                audio.rate     = 48000
                audio.channels = 1
                audio.position = [ MONO ]
                # Höher als jede echte Quelle (die physischen liegen bei
                # 1800-2100), damit WirePlumber diese Quelle von selbst als
                # Standard-Eingang wählt — auch auf einer frisch installierten
                # Maschine, ohne ein manuelles 'wpctl set-default'.
                #
                # Die Aufnahmeseite läuft dadurch NICHT im Kreis: Filter-Chain
                # setzt auf beide Knoten dieselbe node.link-group, und
                # WirePlumber verlinkt einen Stream niemals mit einem Ziel
                # derselben link-group. Der Filter greift sich also die
                # bestbewertete ECHTE Quelle.
                priority.session = 3000
            }
        }
    }
]
