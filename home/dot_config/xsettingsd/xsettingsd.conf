# Font-Rendering für XWayland-Clients.
#
# Hyprland betreibt keinen XSettings-Daemon. GTK-Programme lesen ihre
# Schrifteinstellungen unter Wayland direkt aus gsettings/dconf und merken davon
# nichts — Toolkits, die über XWayland laufen, aber schon: sie fragen den
# XSETTINGS-Manager und bekommen ohne Daemon gar keine Antwort.
#
# Java/Swing ist der sichtbarste Fall. Ohne diese Werte liefert
# Toolkit.getDesktopProperty("awt.font.desktophints") null, Java2D fällt auf
# seinen Default zurück und rendert Text OHNE Antialiasing — dünn und
# ausgefranst. Nachprüfbar mit dem Aufruf oben in jeder JVM.
#
# Betrifft ebenso GTK2-Reste, Tk und alles andere, was XWayland nutzt.

Xft/Antialias 1
Xft/Hinting   1
Xft/HintStyle "hintslight"

# Subpixel-Rendering. "rgb" passt zu üblichen LCD-Panels mit RGB-Streifen und
# ist am schärfsten. Wenn Kanten farbig säumen: auf "none" setzen, dann
# rendert alles in Graustufen.
Xft/RGBA      "rgb"

# Xft/DPI wird bewusst NICHT gesetzt. XWayland meldet Java pauschal 96 dpi,
# real sind es hier ~109 (3440 px auf 800 mm) — Text ist dadurch rund 12 %
# zu klein. Ein fester Wert wäre aber pro Gerät falsch, sobald Book dazukommt.
# Falls gewünscht: Wert in 1024steln, also 109 * 1024 = 111616, und die Datei
# analog zu monitors.conf.tmpl auf ein chezmoi-Template mit Hostname-Weiche
# umstellen.
# Xft/DPI     111616
