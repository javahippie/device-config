; Modell-Presets fuer den llama.cpp-Router (llama-server.service, Port 8100).
;
; Jede Sektion ist ein Modellname, wie ihn Clients im Feld "model" schicken
; (OpenCode: provider.llamacpp.models.<name> in opencode.json muss dazu passen).
; Schluessel sind llama-server-Argumente ohne fuehrende Striche. Aenderungen hier
; brauchen KEINEN Neustart der Unit, aber ein `llm reload` (GET /models?reload=1):
; der Router liest die Datei nur beim Start und auf diesen Aufruf, NICHT beim
; Laden eines Modells — gemessen am 13.10.2026, eine neue Zeile kam ohne reload
; nie bei der Instanz an. Bereits geladene Instanzen behalten ihre Werte, bis
; sie entladen und neu geladen werden (llm unload/load).
;
; Modelle liegen unter ~/.local/share/llama.cpp/models (nicht im Repo, zu
; gross; `llm pull <URL>` laedt sie dorthin). Die Pfade hier sind absolut,
; weil relative Pfade am CWD des Routers haengen.
;
; Die Grundregel dieser Maschine, gemessen am 26.08.2026 und im README belegt:
; die RX 6400 hat 4 GB VRAM und ist nur ~2x so schnell wie die CPU. Ein
; 30B-MoE-Modell passt nicht hinein, und der Hybrid (Teil GPU, Teil CPU) verliert
; gegen die reine CPU in JEDER Spalte: Prefill 175 vs 126 tok/s, Generierung
; 21 vs 15 tok/s, Kontext 65k vs 32k. Grosse MoE-Modelle laufen deshalb auf der
; CPU mit den 64 GB RAM; die GPU ist fuer Embedder, Reranker oder Modelle bis
; ~4B reserviert (Sektion dann mit device = Vulkan0 und n-gpu-layers = 99).
version = 1

[*]
; 12 Threads = 12 physische Kerne. SMT (24) ist bei Bandbreiten-gebundener
; Arbeit gemessen LANGSAMER (60 statt 65 GB/s), nicht nur nicht schneller.
threads = 12
threads-batch = 12
; Prefill-Batch 4096 statt Default 512: +34 % beim Prompt-Verarbeiten auf CPU.
; Das war der groesste einzelne Hebel der alten Messreihe.
batch-size = 4096
ubatch-size = 4096
; KV-Cache in f16, nicht q8_0: +8 % Prefill, und bei 64 GB RAM ist der Platz
; nicht das Problem. Flash Attention an, sonst skaliert langer Kontext schlecht.
cache-type-k = f16
cache-type-v = f16
flash-attn = on
; Kein Offload per Default. "none" statt bloss n-gpu-layers = 0: llama-server
; sieht auch die iGPU (Raphael, Vulkan1) als Geraet und wuerde sonst Puffer
; darauf anlegen. Wer die GPU will, ueberschreibt beides in seiner Sektion.
device = none
n-gpu-layers = 0
; Chat-Template per Jinja aus den GGUF-Metadaten, Pflicht fuer Tool-Calling.
jinja = true
; EIN Slot, keine parallelen Anfragen. Gemessen am 13.10.2026 mit OpenCode:
; dessen Titel-Generierung (small_model) lief gleichzeitig zur Hauptanfrage,
; und beide Prefills teilten sich die 12 Kerne — der kleine fiel auf 7 tok/s,
; der grosse auf 107 statt 175. Auf einer CPU gewinnt Nacheinander: die zweite
; Anfrage wartet ein paar Sekunden, statt die erste zu halbieren. Der
; Prompt-Cache (cache-ram, Default) haelt den 8k-System-Prompt von OpenCode
; auch dann im RAM, wenn eine andere Anfrage den Slot zwischendurch belegt.
parallel = 1

; gpt-oss-20b: 21B MoE mit 3,6B aktiv, 12 GB in MXFP4 (das native Format, es
; gibt nichts Kleineres ohne Qualitaetsverlust). Erste Wahl fuer Tool-Calling
; und damit fuer MCP-Arbeit, und das schnellste der drei. OpenAI empfiehlt
; temp 1.0 / top-p 1.0 — abweichende Werte machen es messbar schlechter.
[gpt-oss-20b]
model = /home/zoellert/.local/share/llama.cpp/models/gpt-oss-20b-MXFP4.gguf
c = 131072
temp = 1.0
top-p = 1.0

; gpt-oss-20b als GPU-Hybrid, gleiche Idee wie bei Qwen: Attention + KV auf der
; Karte, die MXFP4-Experten auf der CPU. Der KV-Cache ist hier klein (jede
; zweite Schicht Sliding Window 128), 32k passen in f16 neben die Attention-
; Gewichte. Messung s. README.
[gpt-oss-20b-gpu]
model = /home/zoellert/.local/share/llama.cpp/models/gpt-oss-20b-MXFP4.gguf
device = Vulkan0
n-gpu-layers = 99
n-cpu-moe = 24
c = 32768
ubatch-size = 512
temp = 1.0
top-p = 1.0

; Qwen3-30B-A3B-Instruct-2507: der bekannte Kandidat aus der Messreihe
; (21 tok/s bei 65k Kontext). Unsloth-Dynamic-Quant Q4_K_XL statt Q4_K_M:
; gleiche Groesse, bessere Perplexity. Sampling laut Modellkarte.
[qwen3-30b-a3b-instruct]
model = /home/zoellert/.local/share/llama.cpp/models/Qwen3-30B-A3B-Instruct-2507-UD-Q4_K_XL.gguf
c = 65536
temp = 0.7
top-p = 0.8
top-k = 20
min-p = 0

; Dasselbe Modell als GPU-Hybrid: Attention und KV-Cache auf der RX 6400, alle
; Experten (das Gros der 17 GB) bleiben per n-cpu-moe auf der CPU. Der Versuch
; vom August verlor bei 2k Kontext gegen die reine CPU. Bei 20k Kontext ist
; aber genau die Attention der Flaschenhals (Prefill 78 statt 166 tok/s, Gen 6
; statt 20), und die laeuft hier auf der Karte. Kontext 32k und KV in q8_0,
; weil in die 4 GB (1,3 GB belegt das Display) nicht mehr passt; ubatch 512,
; weil der Rechenpuffer fuer 4096 auf der GPU zu gross wuerde. Messung s. README.
[qwen3-30b-a3b-gpu]
model = /home/zoellert/.local/share/llama.cpp/models/Qwen3-30B-A3B-Instruct-2507-UD-Q4_K_XL.gguf
device = Vulkan0
n-gpu-layers = 99
n-cpu-moe = 48
c = 32768
cache-type-k = q8_0
cache-type-v = q8_0
ubatch-size = 512
temp = 0.7
top-p = 0.8
top-k = 20
min-p = 0

; Qwen3.6-35B-A3B: der staerkste der drei, Thinking-Modell (Gedanken landen
; dank reasoning-format in reasoning_content, nicht im Text). Sampling laut
; Modellkarte fuer den Thinking-Modus. Noch nicht gemessen, s. README.
[qwen3.6-35b-a3b]
model = /home/zoellert/.local/share/llama.cpp/models/Qwen3.6-35B-A3B-UD-Q4_K_XL.gguf
c = 65536
temp = 0.6
top-p = 0.95
top-k = 20
min-p = 0
reasoning-format = deepseek
