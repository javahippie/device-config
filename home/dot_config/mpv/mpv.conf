# Gilt fuer JEDEN mpv-Aufruf, auch den von Hand im Terminal.
#
# Hier steht bewusst nur eine Zeile: die anderen Player-Optionen (ruhiger
# Output, Fortschrittsbalken) stehen im Handler
# dot_local/share/applications/mpv-audio.desktop, weil sie nur fuer das kleine
# Player-Fenster gedacht sind. Was hier landet, muss auch fuer Video stimmen.
#
# audio-display=no: Cover-Art in MP3/FLAC ist fuer mpv eine VIDEOSPUR (Default
# ist embedded-first). Ohne diese Zeile macht `mpv album/track.flac` im
# Terminal ein Fenster mit dem Albumcover auf, und der Tiler kachelt es in die
# aktive Workspace ein — dasselbe Fenstermodell-Problem wie bei LibreOffice.
# Das ist NICHT dasselbe wie --no-video: echte Videodateien spielt mpv
# weiterhin normal ab, es wird nur das Standbild aus Audio-Tags nicht mehr als
# Video behandelt. Deshalb darf die Zeile global stehen.
audio-display=no
