# podman.service ohne Leerlauf-Timeout.
#
# `podman system service` beendet sich laut Doku nach --time Sekunden ohne
# Aktivität; der Default ist 5. Beim socket-aktivierten Betrieb ist das
# normalerweise gewollt (kein Dauerprozess, systemd startet bei Bedarf neu).
#
# Testcontainers hält aber lange Verbindungen offen — Event-Stream,
# Wait-Strategien, Log-Follow. Verschwindet der Dienst darunter, reisst die
# Verbindung mitten in der Anfrage ab, und der Test scheitert mit
# "Datenübergabe unterbrochen (broken pipe)". Der Fehler sieht dann nach einem
# Container-Problem aus, ist aber der Socket.
#
# Preis: der Dienst läuft nach der ersten Nutzung durch, bis podman.socket
# gestoppt wird. Ein Podman-Prozess im Leerlauf, das ist der Handel wert.
#
# Leeres ExecStart= zuerst ist Pflicht: sonst hängt systemd den zweiten Aufruf
# an den ersten an, statt ihn zu ersetzen.
# $LOGGING kommt aus der Original-Unit und bleibt erhalten.
[Service]
ExecStart=
ExecStart=/usr/bin/podman $LOGGING system service --time=0
